# A chip family named like a built-in one, esp32c5, with one chip the built-in family does not have. Loading it
# must replace the built-in family, so esp32c5 itself is then unknown.
name: esp32c5
variants:
- name: mcu-run-test-chip
  cores:
  - name: cpu0
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Ram
    name: sram
    range:
      start: 0x40800000
      end: 0x40860000
    cores:
    - cpu0
