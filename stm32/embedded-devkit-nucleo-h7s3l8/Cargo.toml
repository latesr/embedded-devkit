[package]
name = "embedded-devkit-nucleo-h7s3l8"
description = "The embedded-devkit test platform for the NUCLEO-H7S3L8: start-up from external flash, bring-up, the boot counter and the console transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/latesr/embedded-devkit"
publish = false

# The tests run on the board, through the smoke test binary. Nothing here runs under the host test harness.
[lib]
test = false
doctest = false

[[example]]
name = "console"
test = false

[[example]]
name = "console_async"
test = false
required-features = ["embassy"]

[[example]]
name = "exit"
test = false

[[test]]
name = "smoke"
harness = false

[[test]]
name = "executors"
harness = false
required-features = ["embassy"]

[features]
# Embassy's interrupt executors, and an async transport for the console (B-3, B-4).
embassy = ["dep:embassy-executor"]

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2"
defmt = "1.1"
defmt-rtt = "1.3"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-interrupt", "defmt"], optional = true }
embassy-stm32 = { version = "0.6", features = ["stm32h7s3l8", "defmt", "unstable-pac", "time-driver-tim2"] }
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }
embedded-io = "0.7"
mcu-console = { workspace = true }
semihosting = { version = "0.1", features = ["stdio", "panic-handler"] }

[dev-dependencies]
static_cell = "2"
embedded-test = { version = "0.7", default-features = false, features = ["semihosting", "defmt"] }

[lints]
workspace = true
