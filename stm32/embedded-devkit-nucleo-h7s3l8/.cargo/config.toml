[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
runner = "mcu run"
rustflags = [
    "-C", "link-arg=-Tembedded-test.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tmcu-run.x",
    "-C", "link-arg=--build-id=sha1",
]

[env]
DEFMT_LOG = "info"
