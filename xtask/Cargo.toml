[package]
name = "xtask"
description = "Repository tasks: the checks, the shared commands and the sync to other repos. Not published."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
# `cargo xtask iperf-server` runs its server. The rev must match mcu-console-net's.
embedded-iperf2 = { git = "https://github.com/latesr/embedded-iperf2", rev = "a16be475e2d3cb6dff6b7a088df47c73f7b21089", version = "0.1.0", features = ["std"] }
if-addrs = "0.15"
# Its `#[mutants::skip]` marks the shared functions that a host test cannot check.
mutants = "0.0.4"
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
pulldown-cmark = { version = "0.13", default-features = false }
toml = "0.9"

[dev-dependencies]
# The size tests write a small ELF image to read back.
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std", "write"] }

[lints]
workspace = true
