[package]
name = "crypto-timing"
description = "How long the ESP32-S31's ECC and SHA blocks take, beside embassy-crypto's rustcrypto drivers"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace and lock file, because the ESP32 board crates' workspace cannot resolve embassy-crypto-rustcrypto:
# esp-radio's ieee802154 0.6.1 takes ccm 0.4.4, which pins subtle to =2.4, and p256 0.14 needs subtle 2.6.
# `cargo xtask check` does not build this crate. Run `cargo test --release` here with the S31 attached, and
# `cargo fmt --check` and `cargo clippy --release --lib --test crypto_timing -- -D warnings` before a commit.
[workspace]

# The tests run on the board. Nothing here runs under the host test harness.
[lib]
test = false
doctest = false

[[test]]
name = "crypto_timing"
harness = false

[dependencies]
defmt = "1.1"
defmt-rtt = "1.3"
# At the embassy commit that embedded-tls pins. embassy-crypto links once per binary.
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1", features = [
    "embassy-crypto-sha256",
    "embassy-crypto-p256-arith",
    "embassy-crypto-p256-ecdh",
    "embassy-crypto-p256-ecdsa",
    "embassy-crypto-p384-arith",
    "embassy-crypto-p384-ecdh",
    "embassy-crypto-p384-ecdsa",
    "embassy-crypto-x25519",
    "embassy-crypto-ed25519",
] }
# The same esp-hal commit as the board crates, from esp/Cargo.toml.
esp-bootloader-esp-idf = { git = "https://github.com/latesr/esp-hal", rev = "828059d4276ed62b48f2e95a04106fc89fda17a0", features = ["esp32s31"] }
esp-hal = { git = "https://github.com/latesr/esp-hal", rev = "828059d4276ed62b48f2e95a04106fc89fda17a0", features = ["esp32s31", "unstable", "defmt"] }
semihosting = { version = "0.1", features = ["stdio", "panic-handler"] }

[dev-dependencies]
# The RSA block's modulus parameters, as esp-hal's own RSA test computes them.
crypto-bigint = { version = "0.7.5", default-features = false }
embedded-test = { version = "0.7", default-features = false, features = ["semihosting", "defmt"] }
# The rsa crate needs a heap. The test logs the heap's peak use.
esp-alloc = { git = "https://github.com/latesr/esp-hal", rev = "828059d4276ed62b48f2e95a04106fc89fda17a0", features = ["esp32s31", "internal-heap-stats"] }
hex-literal = "1"
# The RSA verify that embedded-tls's `rsa` feature uses, at its version.
rsa = { version = "0.9.9", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["oid"] }

[profile.release]
debug = true
