[package]
name = "crypto-timing"
description = "How long the ESP32-S31's ECC and SHA blocks take, beside embassy-crypto's rustcrypto drivers"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace and lock file, because the ESP32 board crates' lock holds ccm 0.4.4, through esp-radio's
# ieee802154. ccm 0.4.4 pins subtle to =2.4, and embassy-crypto-rustcrypto needs subtle 2.6. ccm 0.4.3 accepts any
# subtle 2, so this crate can join that workspace once its lock holds 0.4.3.
# `cargo xtask check` does not build this crate. Run `cargo test --release` here with the S31 attached, and
# `cargo fmt --check` and `cargo clippy --release --lib --test crypto_timing -- -D warnings` before a commit.
[workspace]

# The tests run on the board. Nothing here runs under the host test harness.
[lib]
test = false
doctest = false

[[test]]
name = "crypto_timing"
harness = false

[dependencies]
defmt = "1.1"
defmt-rtt = "1.3"
# At the embassy commit that the embedded-tls fork on latesr pins. embassy-crypto links once per binary.
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "da5e85fe5d3945d27a0d2066458d0fa3460c8d87" }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "da5e85fe5d3945d27a0d2066458d0fa3460c8d87", features = [
    "embassy-crypto-sha256",
    "embassy-crypto-p256-arith",
    "embassy-crypto-p256-ecdh",
    "embassy-crypto-p256-ecdsa",
    "embassy-crypto-p384-arith",
    "embassy-crypto-p384-ecdh",
    "embassy-crypto-p384-ecdsa",
    "embassy-crypto-x25519",
    "embassy-crypto-ed25519",
] }
# The same esp-hal commit as the board crates, from esp/Cargo.toml.
esp-bootloader-esp-idf = { git = "https://github.com/latesr/esp-hal", rev = "1cd5096724d05bb1e739ed2a0bc0231c3df8d467", features = ["esp32s31"] }
esp-hal = { git = "https://github.com/latesr/esp-hal", rev = "1cd5096724d05bb1e739ed2a0bc0231c3df8d467", features = ["esp32s31", "unstable", "defmt"] }
semihosting = { version = "0.1", features = ["stdio", "panic-handler"] }

[dev-dependencies]
# The RSA block's modulus parameters, as esp-hal's own RSA test computes them.
crypto-bigint = { version = "0.7.5", default-features = false }
embedded-test = { version = "0.7", default-features = false, features = ["semihosting", "defmt"] }
# The rsa crate needs a heap. The test logs the heap's peak use.
esp-alloc = { git = "https://github.com/latesr/esp-hal", rev = "1cd5096724d05bb1e739ed2a0bc0231c3df8d467", features = ["esp32s31", "internal-heap-stats"] }
hex-literal = "1"
# The RSA verify that the embedded-tls fork's `rsa` feature uses, at the fork's version.
# Its SHA-256 is the one the verify takes, so the test uses rsa's re-export of sha2.
rsa = { version = "0.10.0", default-features = false, features = ["encoding", "pkcs1v15"] }

[profile.release]
debug = true
