# This workflow has not run until the repo has a remote. Until then, run `cargo xtask check --full` by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  # A person can start the nightly job from the Actions page, such as to check a fix to it.
  workflow_dispatch:

# No job writes to the repo.
permissions:
  contents: read

# A new push to a pull request cancels the pull request's older run. Every other run has a group of its own, because
# GitHub holds only one pending run per group, and a newer run would cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The mutation step diffs against the commit before the push, so it needs the history.
          fetch-depth: 0
      - name: Install the pinned toolchain and targets
        run: rustup toolchain install
      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.91 --profile minimal
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check --full
      # Cargo rewrites a lock file that does not match its manifests, and the check then tests what was not committed.
      - name: Fail on a lock file that the check changed
        run: git diff --exit-code -- '*Cargo.lock'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      # A new branch has no commit before the push, and GitHub then sends all zeros. A force push can send a commit
      # that is gone. The merge base with main covers both.
      - name: Mutation test the lines this push or pull request changes
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git merge-base HEAD origin/main)"
          fi
          cargo xtask mutants --base "$base"

  # The lock file and the toolchain are pinned, so a nightly run of a commit that has already passed one tests nothing
  # new. A run that a person starts always runs.
  untested:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.passed.outputs.run }}
    steps:
      - id: passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json event \
            --jq '[.[] | select(.event == "schedule" or .event == "workflow_dispatch")] | length')"
          if [ "$passed" = 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi

  nightly:
    needs: untested
    # A run that a person starts skips the untested job, and a job after a skipped one runs only with !cancelled().
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.untested.outputs.run == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain and targets
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-mutants
      - uses: Swatinem/rust-cache@v2
      # cargo xtask check --full covers each feature alone and each pair. This covers every combination.
      - name: Check every feature combination
        run: cargo hack check --workspace --feature-powerset --no-dev-deps
      - name: Mutation test every crate
        run: cargo xtask mutants --all
