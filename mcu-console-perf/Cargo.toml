[package]
name = "mcu-console-perf"
version = "0.1.0"
description = "Performance figures for mcu-console: time, cycles, cycles per instruction, stack depth and heap, around one command"
readme = "README.md"
rust-version = "1.91"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["embedded", "no-std", "console", "performance", "profiling"]
categories = ["embedded", "no-std", "no-std::no-alloc", "development-tools::profiling"]

[package.metadata.devkit]
cross = true

[dependencies]
embassy-time = "0.5"
mcu-console = { path = "../mcu-console" }

[dev-dependencies]
# The mock clock takes a critical section, which the host gets from std.
critical-section = { version = "1", features = ["std"] }
embassy-time = { version = "0.5", features = ["mock-driver"] }

[lints]
workspace = true
